name: Deploy ECS Service

on:
  workflow_call:
    inputs:
      cluster_name:
        required: true
        type: string
      service_name:
        required: true
        type: string
      image_url:
        required: true
        type: string
      container_name:
        required: false
        type: string
        default: ''
      wait_for_stable:
        required: false
        type: boolean
        default: true
      aws_region:
        required: false
        default: ap-northeast-2
        type: string
      environment:
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy-ecs-service:
    environment: ${{ inputs.environment || null }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ inputs.aws_region }}

      - name: Deploy ECS Service
        uses: Cream2025/workflow-kit/.github/actions/common/deploy/ecs-service@main
        with:
          cluster_name: ${{ inputs.cluster_name }}
          service_name: ${{ inputs.service_name }}
          image_url: ${{ inputs.image_url }}
          container_name: ${{ inputs.container_name }}
          aws_region: ${{ inputs.aws_region }}
          wait_for_stable: ${{ inputs.wait_for_stable }}
